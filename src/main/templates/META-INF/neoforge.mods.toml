modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''Readable long-distance projectiles, tracers, smoke trails and confirmed impact effects for Create Big Cannons.'''

[[mixins]]
config = "cbc_long_range_visuals.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "createbigcannons"
type = "required"
versionRange = "[${cbc_version},5.12)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ritchiesprojectilelib"
type = "required"
versionRange = "[${rpl_version},3)"
ordering = "AFTER"
side = "BOTH"

