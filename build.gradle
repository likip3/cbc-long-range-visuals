plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = project.name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        name = 'RealRobotix'
        url = 'https://maven.realrobotix.me/master'
        content {
            includeGroup 'com.rbasamoyai'
            includeGroup 'com.tterrag.registrate'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // NeoForge 1.21.1 uses Mojang mappings, so these published jars work directly.
    implementation("maven.modrinth:create-big-cannons:${cbc_modrinth_version}") {
        transitive = false
    }
    implementation("com.rbasamoyai:ritchiesprojectilelib:${rpl_version}+mc.${minecraft_version}-neoforge") {
        transitive = false
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        cbc_version: cbc_version,
        rpl_version: rpl_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '9.2.1'
    distributionType = Wrapper.DistributionType.BIN
}

idea {
    module {
        downloadSources = true
    }
}

// Opt-in graphical regression runner. Its classes and metadata are never included in the addon JAR.
if (providers.gradleProperty('clientSmokeTest').isPresent()) {
    sourceSets {
        clientSmokeTest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    configurations {
        clientSmokeTestImplementation.extendsFrom implementation
        clientSmokeTestRuntimeOnly.extendsFrom runtimeOnly
    }
    neoForge {
        addModdingDependenciesTo sourceSets.clientSmokeTest
        mods {
            'cbc_visuals_smoke_test' {
                sourceSet sourceSets.clientSmokeTest
            }
        }
        runs.client {
            sourceSet = sourceSets.clientSmokeTest
            gameDirectory = file('.tools/smoke-test-run')
            programArguments.addAll '--quickPlaySingleplayer', 'atlas-regression'
        }
    }
}

